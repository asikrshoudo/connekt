name: android-release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh release list --limit 1000 --json tagName --jq length)
          N=$((COUNT + 1))
          while true; do
            MAJOR=$(( (N - 1) / 9 ))
            PATCH=$(( (N - 1) % 9 + 1 ))
            VERSION="${MAJOR}.0.${PATCH}"
            gh release view "v$VERSION" >/dev/null 2>&1 || break
            N=$((N + 1))
          done
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to app.json
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ github.run_number }}
        run: |
          node -e '
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
          j.expo.version = process.env.VERSION;
          j.expo.android = { ...j.expo.android, versionCode: Number(process.env.CODE) };
          fs.writeFileSync("app.json", JSON.stringify(j, null, 2) + "\n");
          '

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/connekt.jks"
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$SRC" ] || { echo "No release APK found" >&2; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          DEST="connekt-${{ steps.version.outputs.tag }}.apk"
          "${BT}apksigner" sign \
            --ks "$RUNNER_TEMP/connekt.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$DEST" "$SRC"
          "${BT}apksigner" verify --print-certs "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Connekt ${{ steps.version.outputs.tag }}" \
            --notes "Development build at ${GITHUB_SHA::7}. UI-first prototype, no real messaging yet."
